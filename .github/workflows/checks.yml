name: Local checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python scripts/audit_public.py --history
      - run: uv run python scripts/build.py
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'
      - run: terraform fmt -check infra
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - run: uv run python scripts/package_public.py
